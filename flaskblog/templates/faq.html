{% extends "layout.html" %}
{% block content %}
<div class="faq">
  <h1>{{ _('Часті запитання') }}</h1>
  <p class="text-muted">
    {{ _('Не знайшли відповіді? Напишіть нам:') }}
    <a href="mailto:support@learn-catalan.com">support@learn-catalan.com</a>
  </p>

  {% include 'faq/' ~ ('en' if current_lang == 'en' else 'uk') ~ '.html' %}
</div>
{% endblock content %}

{% block scripts %}
<script>
  // A link to /faq#sound opens that answer.
  (function () {
    function openFromHash() {
      var item = window.location.hash && document.getElementById(window.location.hash.slice(1));
      if (item && item.tagName === 'DETAILS') { item.open = true; item.scrollIntoView(); }
    }
    openFromHash();
    window.addEventListener('hashchange', openFromHash);
  })();
</script>
{% endblock scripts %}
