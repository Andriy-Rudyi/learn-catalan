<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#1f7a8c">
    <title>LangWave – {{ _('Обери мову, яку хочеш вивчати') }}</title>
    <meta name="description" content="{{ _('Словники, граматика, читання і вимова для тих, хто вивчає мови.') }}">
    <link rel="canonical" href="{{ root_url() }}/">
    {% for lang in site_languages %}
    <link rel="alternate" hreflang="{{ lang }}" href="{{ root_url() }}/?lang={{ lang }}">
    {% endfor %}
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <style>
      :root {
        --bg: #f6f8f9; --card: #ffffff; --text: #1d2a30; --muted: #5b6b72;
        --accent: #1f7a8c; --line: #dde5e8;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #11181b; --card: #1a2327; --text: #e6eef1; --muted: #9db0b7;
                --accent: #4fb3c6; --line: #2a373c; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
             display: flex; flex-direction: column; }
      main { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 56px 16px 32px; }
      .brand { font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
      .brand span { color: var(--accent); }
      .lead { color: var(--muted); font-size: 1.15rem; margin: 8px 0 32px; }
      .sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px;
               list-style: none; margin: 0; padding: 0; }
      .site { display: block; padding: 20px; border: 1px solid var(--line); border-radius: 14px;
              background: var(--card); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
      .site:hover, .site:focus-visible { border-color: var(--accent); transform: translateY(-2px); }
      .site-native { display: block; font-size: 1.4rem; font-weight: 600; }
      .site-name { display: block; color: var(--muted); margin-top: 4px; }
      .soon { color: var(--muted); margin-top: 24px; }
      footer { text-align: center; padding: 16px; color: var(--muted); font-size: .9rem; }
      footer a { color: inherit; margin: 0 6px; }
      footer a[aria-current] { color: var(--accent); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
  <main>
    <h1 class="brand">Lang<span>Wave</span></h1>
    <p class="lead">{{ _('Обери мову, яку хочеш вивчати') }}</p>
    <ul class="sites">
      {% for site in sites %}
      <li>
        <a class="site" href="{{ site_url(site) }}/?lang={{ current_lang }}" lang="{{ site.code }}">
          <span class="site-native">{{ site.native }}</span>
          <span class="site-name" lang="{{ current_lang }}">{{ site.name }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
    <p class="soon">{{ _('Незабаром буде більше мов.') }}</p>
  </main>
  <footer>
    {% for lang in site_languages %}
    <a href="?lang={{ lang }}" hreflang="{{ lang }}"{% if lang == current_lang %} aria-current="true"{% endif %}>{{ language_names[lang] }}</a>
    {% endfor %}
  </footer>
</body>
</html>
