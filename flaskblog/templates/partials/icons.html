{# Line icons. Menu icons (the default class) show only in the modern design;
   pass cls='lc-icon' for an icon that shows in both. #}
{% macro icon(name, cls='lc-menu-icon') -%}
<svg class="{{ cls }}" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'grammar' -%}
    <path d="M2.5 5.5c3-1.6 6.5-1.6 9.5.8 3-2.4 6.5-2.4 9.5-.8v13c-3-1.6-6.5-1.6-9.5.8-3-2.4-6.5-2.4-9.5-.8z"/><path d="M12 6.3v13"/>
  {%- elif name == 'dictionary' -%}
    <path d="M3 18.5 7.5 6l4.5 12.5"/><path d="M4.8 14h5.4"/><path d="M15 9.5h6"/><path d="M15 13.5h6"/><path d="M15 17.5h4"/>
  {%- elif name == 'conjugator' -%}
    <rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 10h18"/><path d="M9.5 10v10"/>
  {%- elif name == 'phonetics' -%}
    <path d="M11 5 6.5 9H3.5v6h3l4.5 4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/>
  {%- elif name == 'text' -%}
    <path d="M4 6h16"/><path d="M4 10.5h16"/><path d="M4 15h9"/><path d="M4 19.5h6"/><path d="M17.5 14v7"/><path d="M15.5 14h4"/><path d="M15.5 21h4"/>
  {%- elif name == 'book' -%}
    <path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/><path d="M9 8.5h6"/>
  {%- elif name == 'faq' -%}
    <circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6"/><path d="M12 17h.01"/>
  {%- elif name == 'account' -%}
    <circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.4-3.6 4.2-5.5 7.5-5.5s6.1 1.9 7.5 5.5"/>
  {%- elif name == 'my-dictionary' -%}
    <path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/>
  {%- elif name == 'new' -%}
    <path d="M12 5v14"/><path d="M5 12h14"/>
  {%- elif name == 'logout' -%}
    <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h10"/>
  {%- elif name == 'login' -%}
    <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 8l4 4-4 4"/><path d="M4 12h10"/>
  {%- elif name == 'register' -%}
    <circle cx="10" cy="8" r="4"/><path d="M3 20c1.3-3.4 3.8-5.5 7-5.5 1.3 0 2.5.3 3.5.9"/><path d="M18 14v6"/><path d="M15 17h6"/>
  {%- elif name == 'key' -%}
    <circle cx="8" cy="15" r="4"/><path d="M10.8 12.2 20 3"/><path d="M16 7l3 3"/><path d="M14 9l2 2"/>
  {%- elif name == 'mail' -%}
    <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>
  {%- elif name == 'check' -%}
    <path d="M5 12.5 10 17l9-10"/>
  {%- elif name == 'trash' -%}
    <path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/>
  {%- elif name == 'download' -%}
    <path d="M12 4v11"/><path d="M7 10.5 12 15.5 17 10.5"/><path d="M5 20h14"/>
  {%- elif name == 'camera' -%}
    <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>
  {%- endif -%}
</svg>
{%- endmacro %}
