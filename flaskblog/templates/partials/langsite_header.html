{#- Top of every language section page: its name, its menu and, while it
    is hidden, a note that only the editor sees it. -#}
{% if hidden %}
<div class="alert alert-warning py-2">{{ _('Цей розділ ще в розробці: його бачите лише ви як адміністратор.') }}</div>
{% endif %}
<nav class="d-flex flex-wrap align-items-baseline gap-3 mb-3" aria-label="{{ lang_site.native }}">
  <a class="h4 mb-0 text-decoration-none" href="{{ url_for('langsites.home', slug=lang_site.slug) }}" lang="{{ lang_site.code }}">{{ lang_site.native }}</a>
  <a href="{{ url_for('langsites.dictionary_page', slug=lang_site.slug) }}">{{ _('Словник') }}</a>
</nav>
<form class="d-flex gap-2 mb-4" method="get" action="{{ url_for('langsites.dictionary_page', slug=lang_site.slug) }}" role="search">
  <input class="form-control" type="search" name="q" value="{{ query or '' }}" maxlength="100"
         placeholder="{{ _('Слово цією мовою або перекладом') }}" aria-label="{{ _('Пошук слова') }}">
  <button class="btn btn-info" type="submit">{{ _('Знайти') }}</button>
</form>
