{% extends "layout.html" %}
{% block content %}
<article class="media content-section">
    <div class="container mt-1">
        <div class="row">
            <div class="col-md-2">
                <img src="{{ url_for('static', filename='profile_pics/' + post.author.image_file) }}" alt="" class="rounded-circle article-img" style="width: 100px; height: 100px;">
            </div>
            <div class="col-md-10">
                <div class="media-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <div>
                            <a class="me-2" href="{{ url_for('users.user_posts', username=post.author.username) }}">{{ post.author.username }}</a>
                            <small class="text-muted">{{ post.date_posted.strftime('%Y-%m-%d') }}</small>
                        </div>
                        {% if post.author == current_user %}
                        <div>
                            <a href="{{ url_for('posts.update_post', post_id=post.id) }}" class="btn btn-secondary btn-sm mt-1 mb-1">Update</a>
                            <button type="button" class="btn btn-danger btn-sm m-1" data-bs-toggle="modal" data-bs-target="#deleteModal">Delete</button>
                        </div>
                        {% endif %}
                    </div>
                    <hr class="mt-2 mb-2">
                    <h2 class="article-title">{{ post.title }}</h2>
                    <p class="article-content">{{ post.content|safe }}</p>
                </div>
            </div>
        </div>
    </div>
</article>


    <!-- Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
            <h1 class="modal-title fs-5" id="deleteModalLabel">Delete Post?</h1>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <form action="{{ url_for('posts.delete_post', post_id=post.id) }}" method="POST">
                <input class="btn btn-danger" type="submit" value="Delete">
            </form>
            </div>
        </div>
        </div>
    </div>
{% endblock content %}
