# Weekly check of the regional-word marks against Wiktionary.
#
# Runs `flask vocabulary check-dialects --apply --verbs` on a throwaway SQLite
# database and, when data/varieties.json changes, opens a pull request into
# dev. Merging it redeploys the site (Render builds from dev).
#
# To have the pull request opened automatically, enable Settings → Actions →
# General → Workflow permissions → "Allow GitHub Actions to create and approve
# pull requests". Without it the results branch is still pushed and the run
# summary links to "create pull request".
name: Check regional words

on:
  schedule:
    - cron: '17 6 * * 1'  # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-dialects
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLASK_APP: run.py
      SECRET_KEY: ci-only
      DATABASE_PUBLIC_URL: sqlite:///dialect-check.db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Load the dictionary
        run: |
          flask db upgrade
          flask vocabulary seed

      - name: Check against Wiktionary
        run: |
          set -o pipefail
          flask vocabulary check-dialects --apply --verbs --report dialect_report.csv | tee check.log

      - name: Run the tests
        run: python -m unittest flaskblog.tests.test_varieties flaskblog.tests.test_vocabulary

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialect-report
          path: |
            dialect_report.csv
            check.log
          if-no-files-found: ignore

      - name: Describe the pull request
        run: |
          {
            echo "Automatic weekly check of the regional-word marks against Wiktionary"
            echo "(English and Catalan editions, MediaWiki API)."
            echo
            echo '```'
            grep -v '^  ' check.log
            echo '```'
            echo
            echo "The full per-word report (\`dialect_report.csv\`) is attached to the"
            echo "[workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo "Marks are only confirmed or added; words Wiktionary did not confirm keep"
            echo "their mark and are listed in the report as \`not-confirmed\`."
          } > pr-body.md

      - name: Open a pull request
        id: cpr
        # Fails when the repository does not allow Actions to open pull
        # requests; the branch is pushed anyway and the next step links to it.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          base: dev
          branch: automation/dialect-check
          delete-branch: true
          add-paths: flaskblog/vocabulary/data/varieties.json
          commit-message: 'Regional words: weekly Wiktionary check'
          title: 'Regional words: weekly Wiktionary check'
          body-path: pr-body.md

      - name: Summary
        if: always()
        env:
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_OUTCOME: ${{ steps.cpr.outcome }}
        run: |
          {
            if [ -f check.log ]; then
              echo '```'
              grep -v '^  ' check.log
              echo '```'
            fi
            if [ -n "$PR_URL" ]; then
              echo "Pull request: $PR_URL"
            elif [ "$PR_OUTCOME" = "failure" ]; then
              echo "### The results are on branch \`automation/dialect-check\`"
              echo "GitHub Actions may not open pull requests in this repository, so open it by hand:"
              echo "**[Create the pull request](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/dev...automation/dialect-check?expand=1)**"
            else
              echo "No changes: every mark is up to date."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
